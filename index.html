<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6F1">
  <meta name="color-scheme" content="light">
  <title>Le Tulipe | Formulario de pedidos</title>
  <style>
    :root{--magenta:#AB2270;--blush:#ECC7C6;--brown:#472317;--tulipe:#E36DA1;--cream:#FAF6F1;--ivory:#FFFDFB;--line:#EDDCD9;--muted:#856D65;--green:#1F805F;--shadow:0 16px 48px rgba(71,35,23,.085)}
    *{box-sizing:border-box}
    html{height:100%;-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100%;color:var(--brown);background:radial-gradient(ellipse 580px 440px at 5% 1%,#F5DDE4 0%,transparent 75%),radial-gradient(ellipse 540px 520px at 100% 97%,#F6DEDF 0%,transparent 80%),var(--cream);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.48}
    button,input,textarea{font:inherit} button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tulipe);outline-offset:3px}
    a{color:var(--magenta)}
    .shell{width:100%;max-width:690px;margin:0 auto;padding:19px 19px max(30px,env(safe-area-inset-bottom));padding-left:max(19px,env(safe-area-inset-left));padding-right:max(19px,env(safe-area-inset-right))}
    .masthead{display:flex;justify-content:space-between;align-items:center;margin:0 auto 15px;gap:14px}
    .logo{width:108px;height:111px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(71,35,23,.07))}
    .headright{text-align:right}.eyebrow{color:var(--magenta);font-size:11px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}.headright p{margin:7px 0 0;font-size:13px;color:var(--muted)}
    .card{background:rgba(255,253,251,.97);border:1px solid #F0E4E0;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
    .progress-wrap{padding:25px 28px 0;display:flex;align-items:center;gap:10px}.progress-wrap span{font-size:12px;color:var(--muted);font-weight:650}
    .progress-track{height:7px;background:#F4E9E8;border-radius:50px;overflow:hidden;margin:10px 28px 0}.progress-fill{height:100%;width:14.285%;background:linear-gradient(90deg,var(--tulipe),var(--magenta));border-radius:50px;transition:width .36s ease}
    .panel{padding:28px 28px 23px;animation:show .3s ease both}@keyframes show{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
    .kicker{display:inline-flex;background:#FBEAF1;padding:7px 12px;border-radius:100px;color:var(--magenta);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:10px}
    h1,h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.028em;font-weight:650}h1{font-size:clamp(28px,5.6vw,38px);line-height:1.12;margin:18px 0 10px}h2{font-size:clamp(25px,5.2vw,34px);line-height:1.16;margin:14px 0 9px}
    .lead{font-size:14px;color:var(--muted);margin:0 0 22px;line-height:1.65}.flavor-list{display:grid;gap:10px}
    .flavor{display:grid;grid-template-columns:47px minmax(0,1fr) 127px;align-items:center;gap:10px;border:1.3px solid var(--line);padding:12px 13px;border-radius:16px;transition:background .2s,border-color .2s;background:white}
    .flavor.selected{background:#FFF7FA;border-color:var(--tulipe)}.emoji{width:46px;height:46px;border-radius:14px;background:#FAE8EE;display:grid;place-items:center;font-size:25px}
    .flavor-name{font-weight:800;font-size:14px;line-height:1.28}.flavor-note{font-size:11px;color:var(--muted);margin-top:2px}.qty{display:flex;align-items:center;justify-content:space-between;gap:3px}
    .qty button{width:42px;height:44px;border-radius:12px;border:1px solid #EED2DC;background:#FFF1F5;color:var(--magenta);font-size:23px;font-weight:600;line-height:1;touch-action:manipulation}.qty button:active{transform:scale(.94)}.qty button:disabled{opacity:.30;cursor:not-allowed}.qty output{font-variant-numeric:tabular-nums;min-width:22px;text-align:center;font-size:17px;font-weight:850}
    .summary-strip{margin-top:14px;background:#F9EDF1;border:1px solid #F3D8E1;border-radius:17px;padding:13px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
    .summary-strip small{display:block;color:var(--muted);font-size:11px}.summary-strip strong{font-size:22px;color:var(--magenta);font-variant-numeric:tabular-nums}.mini-price{font-size:17px;font-weight:850;color:var(--magenta);margin-top:6px}
    .tag{color:var(--magenta);font-size:11px;font-weight:800;background:white;border-radius:99px;padding:6px 9px;border:1px solid #F3D8E1}
    .hint{font-size:12px;color:var(--muted);margin:12px 0 0}.options{display:grid;gap:12px}.location{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:14px;text-align:left;background:white;border:1.5px solid var(--line);border-radius:18px;padding:17px 18px;color:var(--brown);font-weight:800;font-size:16px}
    .location .symbol{width:42px;height:42px;background:#FAEBEE;border-radius:13px;display:grid;place-items:center;font-size:21px}.location .check{margin-left:auto;width:24px;height:24px;border:2px solid #E6CDD0;border-radius:50%;display:grid;place-items:center;font-size:14px;color:white}.location.active{border-color:var(--magenta);background:#FFF6FA}.location.active .check{background:var(--magenta);border-color:var(--magenta)}
    label.fieldlabel{font-size:13px;font-weight:750;display:block;margin:12px 0 8px}.text-input,.text-area{width:100%;border:1.5px solid #EBD9D5;background:white;border-radius:15px;color:var(--brown);font-size:17px;padding:16px;min-height:56px;outline:0}.text-input:focus,.text-area:focus{border-color:var(--magenta);box-shadow:0 0 0 3px #FBE3EF}.text-input::placeholder,.text-area::placeholder{color:#B9A8A3}.text-area{resize:vertical;min-height:88px;font-size:14px}
    .field-tip{font-size:12px;color:var(--muted);margin-top:10px}.optional{font-weight:600;color:#A48A82;font-size:12px}.backnotice{padding:12px 14px;border-radius:13px;background:#FBF0F4;color:#925A6D;font-size:12px;margin-top:18px}
    .recap{display:grid;gap:9px;margin-top:17px}.recap-item{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #F1E7E4;padding:10px 0;font-size:14px}.recap-item span{color:var(--muted)}.recap-item strong{text-align:right;max-width:63%;overflow-wrap:anywhere}
    .order-list{background:#FFF6F9;border:1px solid #F3DAE5;padding:13px 17px;border-radius:15px;margin-top:18px}.order-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.order-row b{font-variant-numeric:tabular-nums}.order-total{border-top:1px dashed #E4BCCD;margin-top:9px;padding-top:10px;display:flex;justify-content:space-between;font-weight:850;color:var(--magenta)}
    .consent{display:flex;gap:11px;align-items:flex-start;margin-top:16px;font-size:12px;color:var(--muted);cursor:pointer}.consent input{accent-color:var(--magenta);width:18px;height:18px;flex:0 0 18px;margin:1px 0 0}.smallprint{font-size:11px;color:#9A8079;margin-top:8px}
    .footer{border-top:1px solid #F0E4E0;padding:15px 28px 25px;display:flex;gap:10px;align-items:center;background:#FFFBFA}.primary{border:0;border-radius:15px;background:var(--magenta);color:white;min-height:54px;font-size:15px;font-weight:850;letter-spacing:.01em;padding:12px 19px;box-shadow:0 7px 17px rgba(171,34,112,.18);flex:1}.primary:disabled{background:#CEA7BB;box-shadow:none;cursor:not-allowed}.primary:not(:disabled):active{transform:translateY(1px)}.secondary{min-height:54px;min-width:99px;border:1.5px solid #E9D7D7;border-radius:15px;background:white;color:var(--brown);font-weight:780;padding:10px 16px}.secondary:disabled{opacity:.35}
    .form-error{color:#B52243;font-size:12px;font-weight:700;min-height:0;margin:9px 0 0}.footer .spinner{display:inline-block;width:13px;height:13px;border:2px solid #ffffff70;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
    .success{padding:29px 28px 27px;text-align:center;animation:show .36s ease}.success-icon{margin:auto;background:#FBE7F0;color:var(--magenta);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:38px}.success h1{margin-top:17px}.folio{display:inline-block;padding:9px 15px;background:#F9EBF2;color:var(--magenta);border-radius:13px;font-size:13px;font-weight:850;letter-spacing:.02em;margin:3px auto 12px}.center-blurb{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:23px}.success .primary{width:100%;display:block;box-shadow:none}.help{color:var(--muted);font-size:12px;line-height:1.6;margin:11px 0 0}.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.social-link{padding:13px 7px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:white;border:1px solid #EDD5DC;border-radius:13px;color:var(--magenta);font-weight:800;font-size:13px}.social-link[aria-disabled=true]{color:#AA969B;opacity:.64;cursor:not-allowed}.divider{height:1px;background:#EEDFE2;margin:23px 0 17px}.follow-title{font-weight:800;font-size:14px}.copy{color:var(--magenta);border:none;background:none;text-decoration:underline;font-weight:750;font-size:13px;padding:10px;margin:9px 0 0}
    .notice{background:#FFF6E8;border:1px solid #F0DEC0;color:#78552B;border-radius:12px;padding:10px 12px;font-size:12px;text-align:left;margin:12px 0}.preview-badge{display:inline-flex;align-items:center;gap:5px;font-weight:750;font-size:11px;color:#93613D;background:#FFF2DE;padding:5px 9px;border-radius:99px}
    .credits{margin:18px auto 0;text-align:center;color:#937A76;font-size:11px;line-height:1.65}.credit-brand{font-size:10px;color:#AC9591}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){.shell{padding:8px 12px 32px}.masthead{margin-bottom:9px;padding:0 5px}.logo{width:83px;height:92px}.headright p{font-size:11px}.card{border-radius:23px}.progress-wrap{padding:19px 19px 0}.progress-track{margin:9px 19px 0}.panel{padding:23px 18px 19px}.footer{padding:14px 18px 20px}.flavor{grid-template-columns:42px minmax(0,1fr) 119px;gap:8px;padding:9px}.emoji{width:42px;height:42px}.flavor-name{font-size:12px}.flavor-note{font-size:10px}.qty button{width:40px;height:44px}.qty output{font-size:16px}.tag{font-size:10px}h1{font-size:29px}.lead{font-size:13px}.success{padding:28px 19px}.secondary{min-width:86px}}
    @media(max-width:375px){.flavor{grid-template-columns:40px minmax(0,1fr);row-gap:6px}.flavor .qty{grid-column:2;justify-content:flex-start;gap:12px}.flavor .qty output{min-width:24px}.summary-strip{align-items:flex-start;flex-direction:column}.tag{align-self:flex-start}}
    @supports (padding-bottom: env(safe-area-inset-bottom)){.shell{padding-bottom:calc(30px + env(safe-area-inset-bottom))}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>

<script>
(() => {
  'use strict';
  const FLAVORS = [
    {id:'zarzamora',name:'Queso con zarzamora',emoji:'🫐',detail:'Un toque frutal'},
    {id:'fresa',name:'Queso con fresa',emoji:'🍓',detail:'Suave y delicioso'},
    {id:'nuez',name:'Nuez',emoji:'🌰',detail:'Textura y un toque semillas'},
    {id:'chocolate',name:'Chocolate',emoji:'🍫',detail:'Para los más golosos'},
    {id:'nutella',name:'Nutella',emoji:'🍫',detail:'Para los más golosos'},
    {id:'natural',name:'Natural',emoji:'🥐',detail:'Mismo sabor mismos recuerdos'}
  ];
  const MAX=50, LAST_STEP=6;
  const DEFAULT_CFG={instagram:'https://www.instagram.com/pastelerialetulipe?stkn=c3ZpOG82MXQzc3Rh',tiktok:'',privacy:'',prices:{zarzamora:70,fresa:70,nuez:70,chocolate:70,nutella:70,natural:70}};
  let cfg={...DEFAULT_CFG,prices:{...DEFAULT_CFG.prices}};
  // URL pública /exec de Apps Script. Configúrala DESPUÉS de implementar Code.gs.
  const API_URL = 'https://script.google.com/macros/s/AKfycbw65swQ9LrTnfjiiVZbI6K4esbfdJXVJ0WdHQDv1VThCCJL2yg756p9aAwzxS0_Qkw/exec';
  const apiConfigured = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(API_URL);
  const PENDING_KEY = 'LT_PENDING_ORDER_V2';
  let pendingOrder=null;
  try { pendingOrder=JSON.parse(sessionStorage.getItem(PENDING_KEY)||'null'); }
  catch(e) { pendingOrder=null; }
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function makeRequestId(){
    const random=new Uint8Array(16);
    window.crypto.getRandomValues(random);
    return 'LTREQ_'+Array.from(random).map(b=>('0'+b.toString(16)).slice(-2)).join('');
  }
  function checkSaved(requestId){
    return new Promise((resolve,reject)=>{
      const callbackName='LTcb_'+makeRequestId().slice(6);
      let done=false;
      const tag=document.createElement('script');
      const cleanup=()=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        tag.remove();
        try{delete window[callbackName]}catch(e){window[callbackName]=undefined}
      };
      const timer=setTimeout(()=>{cleanup();reject(new Error('Tiempo de consulta agotado'));},6500);
      window[callbackName]=value=>{
        cleanup();
        if(!value || value.requestId!==requestId){reject(new Error('Respuesta no válida'));return}
        resolve(value);
      };
      tag.onerror=()=>{cleanup();reject(new Error('No se pudo consultar Google'));};
      tag.src=API_URL+'?action=estado&requestId='+encodeURIComponent(requestId)
        +'&callback='+encodeURIComponent(callbackName)+'&_='+Date.now();
      document.head.appendChild(tag);
    });
  }
  const blank=()=>({qty:{zarzamora:0,fresa:0,nuez:0,chocolate:0,nutella:0,natural:0},delivery:'',otherPlace:'',firstName:'',lastName:'',phone:'',instagram:'',notes:'',consent:false});
  let state=blank(),step=0,saving=false,confirmation=null;
  try{const saved=sessionStorage.getItem('LT_DRAFT_V1');if(saved){const s=JSON.parse(saved);if(s&&typeof s==='object')state={...blank(),...s,qty:{...blank().qty,...s.qty}}}}catch(e){}
  const $=id=>document.getElementById(id);
  const esc=s=>String(s == null ? '' : s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const selected=()=>FLAVORS.filter(f=>state.qty[f.id]>0);
  const total=()=>FLAVORS.reduce((s,f)=>s+(Number(state.qty[f.id])||0),0);
  const formatPesos=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0,minimumFractionDigits:0}).format(n);
  function getAmount(){let sum=0;for(const f of selected()){const price=(cfg.prices && cfg.prices[f.id]);if(typeof price!=='number'||!Number.isFinite(price)||price<0)return null;sum+=price*state.qty[f.id]}return sum}
  const getPlace=()=>state.delivery==='Otro'?state.otherPlace.trim():state.delivery;
  const saveDraft=()=>{try{sessionStorage.setItem('LT_DRAFT_V1',JSON.stringify(state))}catch(e){}};
  const phoneDigits=()=>{let s=state.phone.replace(/\D/g,'');if(s.length===12&&s.startsWith('52'))s=s.slice(2);return s};
  function isValidStep(index=step){switch(index){case 0:return total()>0&&total()<=MAX;case 1:return ['Santa Fe','Nezahualcóyotl','Otro'].includes(state.delivery)&&(state.delivery!=='Otro'||state.otherPlace.trim().length>=3);case 2:return state.firstName.trim().length>=2;case 3:return state.lastName.trim().length>=2;case 4:return phoneDigits().length===10;case 5:return true;case 6:return state.consent&&[0,1,2,3,4].every(isValidStep);default:return false}}
  function renderFooter(){const btn=$('next');btn.disabled=!isValidStep()||saving;btn.innerHTML=saving?'<span class="spinner"></span>Guardando solicitud…':step===LAST_STEP?'Solicitar mi pedido ✨':'Continuar →';$('back').disabled=step===0||saving}
  function showError(str){const element=$('inline-error');if(element)element.textContent=str}
  function flavorTemplate(){const num=total(),amount=getAmount();return `
    <span class="kicker">Paso 1 · Tu selección</span><h1>¿Qué sabores se te antojan?</h1>
    <p class="lead">Elige la cantidad de cada sabor tocando <b>+</b> o <b>−</b>. Cada pan cuesta <b>$70 MXN</b>. Usa únicamente los botones <b>+</b> y <b>−</b> para agregar o quitar, hasta <b>50 panes entre todos los sabores</b>.</p>
    <div class="flavor-list">${FLAVORS.map(f=>`<div class="flavor ${state.qty[f.id]?'selected':''}"><div class="emoji" aria-hidden="true">${f.emoji}</div><div><div class="flavor-name">${f.name}</div><div class="flavor-note">${f.detail} · <b>$70 c/u</b></div></div><div class="qty"><button type="button" aria-label="Quitar un pan de ${f.name}" data-qty="${f.id}" data-delta="-1" ${state.qty[f.id]===0?'disabled':''}>−</button><output aria-label="Cantidad de ${f.name}">${state.qty[f.id]}</output><button type="button" aria-label="Agregar un pan de ${f.name}" data-qty="${f.id}" data-delta="1" ${num>=MAX?'disabled':''}>+</button></div></div>`).join('')}</div>
    <div class="summary-strip"><div><small>Has elegido</small><strong>${num} <span style="font-size:13px;font-weight:650">/ ${MAX} panes</span></strong>${amount!==null?`<div class="mini-price">Total de panes: ${formatPesos(amount)}</div>`:''}</div><span class="tag">${num>=MAX?'¡Límite alcanzado!':'Combina tus favoritos ♡'}</span></div>
    <p class="smallprint">El total corresponde únicamente a los panes y no incluye posible costo de entrega.</p>
    <p class="hint">${num===0?'Agrega al menos un pan para continuar.':num===MAX?'Seleccionaste el máximo de 50 panes.':'Puedes cambiar las cantidades cuando quieras.'}</p>`}
  function deliveryTemplate(){const opts=[{name:'Santa Fe',emoji:'📍'},{name:'Nezahualcóyotl',emoji:'🚗'},{name:'Otro',emoji:'🗺️'}];return `<span class="kicker">Paso 2 · Entrega</span><h2>¿Dónde te entregamos?</h2><p class="lead">Selecciona la zona que te quede mejor.</p><div class="options">${opts.map(o=>`<button class="location ${state.delivery===o.name?'active':''}" data-location="${o.name}" type="button" aria-pressed="${state.delivery===o.name}"><span class="symbol">${o.emoji}</span><span>${o.name}</span><span class="check">${state.delivery===o.name?'✓':''}</span></button>`).join('')}</div>${state.delivery==='Otro'?`<label class="fieldlabel" for="otherPlace">¿En qué lugar?</label><input class="text-input" id="otherPlace" data-field="otherPlace" maxlength="120" placeholder="Colonia, municipio o punto de entrega" value="${esc(state.otherPlace)}"><p class="field-tip">Te confirmaremos si hay entrega disponible en la zona.</p>`:''}<p class="hint">La ubicación exacta y el costo de envío se confirman al dar seguimiento.</p>`}
  function personTemplate(part){const first=part==='firstName',title=first?'¿Cómo te llamas?':'¿Cuál es tu apellido?',sub=first?'Queremos saber a quién preparar su pedido.':'Así podremos identificar tu solicitud fácilmente.',idx=first?3:4;return `<span class="kicker">Paso ${idx} · Tus datos</span><h2>${title}</h2><p class="lead">${sub}</p><label class="fieldlabel" for="person">${first?'Nombre':'Apellido'} *</label><input class="text-input" id="person" data-field="${part}" type="text" maxlength="60" autocomplete="${first?'given-name':'family-name'}" placeholder="Escribe tu ${first?'nombre':'apellido'}" value="${esc(state[part])}"><p class="field-tip">Solo necesitamos esta información para tu pedido.</p>`}
  function phoneTemplate(){return `<span class="kicker">Paso 5 · Contacto</span><h2>¿A qué número te contactamos?</h2><p class="lead">Lo usaremos únicamente para dar seguimiento a tu solicitud.</p><label class="fieldlabel" for="phone">Teléfono celular *</label><input class="text-input" id="phone" data-field="phone" type="tel" maxlength="18" inputmode="tel" autocomplete="tel" placeholder="10 dígitos · Ej. 5512345678" value="${esc(state.phone)}"><p class="field-tip">Puedes escribir tu número de México con o sin +52.</p>`}
  function instagramTemplate(){return `<span class="kicker">Paso 6 · ¡Casi terminamos!</span><h2>¿Tienes Instagram?</h2><p class="lead">Nos encantaría conocerte por ahí. Este dato es completamente opcional.</p><label class="fieldlabel" for="instagram">Usuario de Instagram <span class="optional">(opcional)</span></label><input class="text-input" id="instagram" data-field="instagram" type="text" maxlength="60" autocomplete="off" placeholder="@tuusuario" value="${esc(state.instagram)}"><div class="backnotice">♡ Puedes dejarlo vacío y continuar sin problema.</div>`}
  function orderRows(){return selected().map(f=>`<div class="order-row"><span>${esc(f.name)}</span><b>× ${state.qty[f.id]}</b></div>`).join('')}
  function recapTemplate(){const amount=getAmount();return `<span class="kicker">Paso 7 · Revisa tu pedido</span><h2>¡Todo listo! Revisa los detalles</h2><p class="lead">Comprueba que todo esté correcto antes de enviar tu solicitud.</p>
    <div class="order-list">${orderRows()}<div class="order-total"><span>Total de panes</span><span>${total()} / ${MAX}</span></div>${amount!==null?`<div class="order-total"><span>Total de los panes ($70 c/u)</span><span>${formatPesos(amount)}</span></div>`:'<p class="smallprint">El precio se confirmará durante la cotización.</p>'}</div>
    <div class="recap"><div class="recap-item"><span>Nombre</span><strong>${esc(state.firstName.trim())} ${esc(state.lastName.trim())}</strong></div><div class="recap-item"><span>Celular</span><strong>${esc(state.phone)}</strong></div><div class="recap-item"><span>Entrega</span><strong>${esc(getPlace())}</strong></div>${state.instagram.trim()?`<div class="recap-item"><span>Instagram</span><strong>${esc(state.instagram)}</strong></div>`:''}</div>
    <label class="fieldlabel" for="notes">¿Algo más que debamos saber? <span class="optional">(opcional)</span></label><textarea class="text-area" id="notes" data-field="notes" maxlength="350" placeholder="Aclaraciones sobre tu pedido...">${esc(state.notes)}</textarea>
    <label class="consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>Acepto que Le Tulipe utilice mis datos para dar seguimiento a esta solicitud. No se efectúa ningún pago en este formulario.</span></label>
    ${cfg.privacy&&/^https:\/\//i.test(cfg.privacy)?`<p class="smallprint"><a href="${esc(cfg.privacy)}" target="_blank" rel="noopener noreferrer">Consulta nuestro aviso de privacidad ↗</a></p>`:''}<p class="smallprint">Al pulsar «Solicitar mi pedido ✨» registraremos tu solicitud y mostraremos un folio. La disponibilidad y el costo de entrega, si aplica, se confirmarán después. El precio de cada pan es de $70 MXN.</p><div class="form-error" id="inline-error" role="alert"></div>`}
  const templates=[flavorTemplate,deliveryTemplate,()=>personTemplate('firstName'),()=>personTemplate('lastName'),phoneTemplate,instagramTemplate,recapTemplate];
  function render(){if(confirmation){renderSuccess();return}const pct=Math.round((step+1)/7*100);$('step-label').textContent=`Paso ${step+1} de 7`;$('progress-track').setAttribute('aria-valuenow',pct);$('progress-fill').style.width=pct+'%';$('content').innerHTML=`<div class="panel">${templates[step]()}</div>`;renderFooter()}
  function buildPayload(){return {qty:{...state.qty},delivery:state.delivery,otherPlace:state.otherPlace.trim(),firstName:state.firstName.trim(),lastName:state.lastName.trim(),phone:phoneDigits(),instagram:state.instagram.trim(),notes:state.notes.trim(),consent:state.consent}}
  function buildMessage(folio){const a=getAmount(),rows=selected().map(f=>`• ${f.name}: ${state.qty[f.id]}`).join('\n');return `🌷 LE TULIPE · RESUMEN DE SOLICITUD\n\nFolio: ${folio}\nNombre: ${state.firstName.trim()} ${state.lastName.trim()}\nCelular: ${phoneDigits()}\nLugar de entrega: ${getPlace()}\n\nSabores seleccionados:\n${rows}\nTotal: ${total()} panes${a!==null?`\nTotal de los panes: ${formatPesos(a)}`:''}${state.instagram.trim()?`\nInstagram: ${state.instagram.trim()}`:''}${state.notes.trim()?`\nComentarios: ${state.notes.trim()}`:''}\n\nSolicitud sujeta a confirmación de disponibilidad y entrega. Panes a $70 MXN por pieza, sin incluir posibles gastos de envío.`}
  function renderSuccess(){const f=confirmation.folio,msg=buildMessage(f);$('step-label').textContent='Solicitud registrada';$('progress-track').setAttribute('aria-valuenow','100');$('progress-fill').style.width='100%';$('nav').style.display='none';const social=(url,label,icon)=>url&&/^https:\/\//i.test(url)?`<a class="social-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon} ${label} ↗</a>`:`<span class="social-link" aria-disabled="true">${icon} ${label}</span>`;
    $('content').innerHTML=`<div class="success"><div class="success-icon" aria-hidden="true">🌷</div><h1>¡Gracias por tu pedido!</h1><p class="center-blurb">${esc(state.firstName.trim())}, ${confirmation.saved?'hemos registrado':'preparamos una vista previa de'} tu solicitud de <b>${total()} panes</b>. ${confirmation.saved?'Guarda este folio para consultar el estado de tu pedido.':'Estás probando el formulario antes de publicarlo.'}</p><div class="folio">${esc(f)}</div><div class="order-list" style="text-align:left">${orderRows()}<div class="order-total"><span>Total de panes</span><span>${total()}</span></div>${getAmount()!==null?`<div class="order-total"><span>Total de los panes ($70 c/u)</span><span>${formatPesos(getAmount())}</span></div>`:''}</div>
    ${confirmation.saved?'':'<div class="notice">No se ha registrado este pedido.</div>'}
    <div class="divider"></div><div class="follow-title">¡Conoce más de Le Tulipe! 💗</div><p class="help">Visita nuestras redes para ver postres, promociones y novedades.</p><div class="socials">${social(cfg.instagram,'Instagram','◎')}${social(cfg.tiktok,'TikTok','♫')}</div>
    <button class="copy" type="button" id="copy-order">Copiar mi folio y resumen</button><div id="copy-info" class="field-tip" role="status"></div><p class="help">Si deseas consultar tu pedido por mensaje directo, copia el resumen y pégalo en la red social que prefieras.</p><button type="button" class="secondary" style="margin-top:21px" id="restart">Hacer otro pedido</button></div>`;
    $('copy-order').addEventListener('click',()=>copyMessage(msg));$('restart').addEventListener('click',()=>{confirmation=null;state=blank();step=0;$('nav').style.display='flex';saveDraft();render()});
  }
  async function copyMessage(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const area=document.createElement('textarea');area.value=t;area.style.cssText='position:fixed;opacity:0;';document.body.appendChild(area);area.select();try{ok=document.execCommand('copy')}catch(x){}area.remove()}$('copy-info').textContent=ok?'✓ Resumen copiado al portapapeles.':'Selecciona y copia el resumen manualmente desde la pantalla.'}
  async function finish(){
    if(saving||!isValidStep()){showError('Revisa tus respuestas para poder continuar.');return}
    if(!apiConfigured){showError('Falta configurar la URL /exec de Google Apps Script dentro de index.html.');return}
    if(!window.crypto||!window.crypto.getRandomValues){showError('Abre el formulario desde tu página HTTPS de GitHub Pages.');return}
    // Conservar el mismo payload e identificador en los reintentos evita pedidos duplicados.
    if(!pendingOrder || !pendingOrder.requestId || !pendingOrder.payload){
      pendingOrder={requestId:makeRequestId(),payload:buildPayload()};
      try{sessionStorage.setItem(PENDING_KEY,JSON.stringify(pendingOrder))}catch(e){}
    }
    if(JSON.stringify(pendingOrder.payload)!==JSON.stringify(buildPayload())){
      showError('Ya intentaste registrar esta solicitud con otros datos. Revisa Google Sheets antes de iniciar un pedido nuevo.');
      return;
    }
    saving=true;
    renderFooter();
    showError('');
    const id=pendingOrder.requestId;
    const packet={...pendingOrder.payload,requestId:id};
    // POST simple, sin CORS ni cabeceras especiales. Su respuesta opaca NO significa éxito.
    // Solo la consulta de estado con un folio REAL permite confirmar la compra.
    fetch(API_URL,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(packet)
    }).catch(()=>{});
    const deadline=Date.now()+32000;
    let found=null;
    while(Date.now()<deadline){
      await wait(1750);
      try{
        const status=await checkSaved(id);
        if(status.saved===true && /^LT-\d{8}-\d{5}$/.test(status.folio||'')){
          found=status;
          break;
        }
      }catch(e){/* se reintentará comprobar el folio */}
    }
    saving=false;
    if(found){
      confirmation={folio:found.folio,saved:true};
      pendingOrder=null;
      try{sessionStorage.removeItem(PENDING_KEY);sessionStorage.removeItem('LT_DRAFT_V1')}catch(e){}
      renderSuccess();
      return;
    }
    renderFooter();
    showError('No pudimos confirmar el registro en Google Sheets. No consideres confirmado tu pedido. Revisa la pestaña Pedidos antes de reenviarlo; el botón intentará el MISMO folio para evitar duplicados.');
  }
  document.addEventListener('click',e=>{
    const qtyBtn=e.target.closest('[data-qty]');if(qtyBtn){const id=qtyBtn.dataset.qty,delta=Number(qtyBtn.dataset.delta);if(!(id in state.qty))return;const next=state.qty[id]+delta;if(next<0||next>MAX||(delta>0&&total()>=MAX))return;state.qty[id]=next;saveDraft();render();return}
    const locBtn=e.target.closest('[data-location]');if(locBtn){state.delivery=locBtn.dataset.location;saveDraft();render();if(state.delivery==='Otro' && $('otherPlace'))$('otherPlace').focus();return}
  });
  $('content').addEventListener('input',e=>{const field=e.target.dataset.field;if(field&&Object.prototype.hasOwnProperty.call(state,field)){state[field]=e.target.value;saveDraft();renderFooter();showError('')}});
  $('content').addEventListener('change',e=>{if(e.target.id==='consent'){state.consent=e.target.checked;saveDraft();renderFooter()}});
  $('back').addEventListener('click',()=>{if(step>0&&!saving){step--;render()}});
  $('next').addEventListener('click',()=>{if(!isValidStep()){showError('Completa este paso antes de continuar.');return}if(step===LAST_STEP){finish()}else{step++;render()}});
  // GitHub Pages: los enlaces de redes se configuran en DEFAULT_CFG.
  render();
})();
</script>
</body>
</html>
